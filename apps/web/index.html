<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      // Keep the storage key in sync with src/core/config/theme.ts.
      ;(() => {
        let preference = 'system'
        try {
          preference = localStorage.getItem('kab-game-theme') || 'system'
        } catch {}
        document.documentElement.dataset.theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      })()
    </script>
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />
    <title>Kab Game</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
