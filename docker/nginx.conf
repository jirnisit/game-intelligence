map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream game_intelligence_api {
    server gint-api:3000;
    keepalive 16;
}

upstream game_intelligence_web {
    server gint-web:5173;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://game_intelligence_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://game_intelligence_web;
        proxy_http_version 1.1;
        # Use a loopback Host for Vite's internal host validation.
        proxy_set_header Host localhost:5173;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
